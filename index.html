<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inky Pramudia Ramdhani</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #ccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #888;
            font-weight: 400;
        }

        .websites-grid {
            display: grid;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .website-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .website-card:hover {
            background: #161616;
            border-color: #333;
            transform: translateY(-2px);
        }

        .website-title {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .website-description {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .website-url {
            color: #666;
            font-size: 0.9rem;
            text-decoration: none;
            font-family: 'Courier New', monospace;
            transition: color 0.3s ease;
        }

        .website-url:hover {
            color: #999;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tech-tag {
            background: #1a1a1a;
            color: #ccc;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            border: 1px solid #333;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .website-card {
                padding: 1.25rem;
            }
            
            .website-title {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.75rem;
            }
            
            h1 {
                font-size: 1.75rem;
            }
            
            .website-card {
                padding: 1rem;
            }
            
            .tech-stack {
                gap: 0.4rem;
            }
            
            .tech-tag {
                font-size: 0.75rem;
                padding: 0.2rem 0.5rem;
            }
        }

        @media (min-width: 769px) {
            .websites-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Inky Pramudia Ramdhani</h1>
            <p class="subtitle">Data Analysist</p>
        </header>

        <div class="websites-grid">
            <div class="website-card">
                <a href="portofolio/" style="text-decoration: none;">
                    <h3 class="website-title">Excel Portofolio</h3>
                    <p class="website-description">A showcase of my creative work and professional experience, featuring interactive dashboard using Ms Excel</p>
                    <div class="tech-stack">
                        <span class="tech-tag">Ms Excel</span>
                        <span class="tech-tag">Visual Basic</span>
                        <span class="tech-tag">Complex Formula</span>
                    </div>
                </a>
            </div>
            <div class="website-card">
                <a href="CV/" style="text-decoration: none;">
                    <h3 class="website-title">Curriculum Vitae</h3>
                    <p class="website-description">My Curriculum Vitae</p>
                    <div class="tech-stack">
                        <span class="tech-tag">HTML</span>
                        <span class="tech-tag">CSS</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
